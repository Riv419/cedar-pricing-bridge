name: 1 - Build pricing recommendations

on:
  workflow_dispatch:
    inputs:
      comps_json:
        description: "Competitor rates JSON from the morning Chrome pass (leave blank to use stored samples)"
        required: false
        default: ""
      events_json:
        description: "Events JSON from the morning web search (Cedar Point days, festivals, holidays) - leave blank to reuse the last list"
        required: false
        default: ""
  schedule:
    # Fallback run at 11:15 UTC (7:15 AM EDT / 6:15 AM EST). Skips itself if today's file already exists.
    - cron: "15 11 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: cedar-pricing
  cancel-in-progress: false

jobs:
  recommend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Sanity-check secrets (prints lengths only, never values)
        env:
          HOSTAWAY_ACCOUNT_ID: ${{ secrets.HOSTAWAY_ACCOUNT_ID }}
          HOSTAWAY_API_KEY: ${{ secrets.HOSTAWAY_API_KEY }}
        run: |
          echo "HOSTAWAY_ACCOUNT_ID length: ${#HOSTAWAY_ACCOUNT_ID} (expected 6 digits)"
          echo "HOSTAWAY_API_KEY length: ${#HOSTAWAY_API_KEY}"
          case "$HOSTAWAY_ACCOUNT_ID" in *[!0-9]*) echo "::warning::HOSTAWAY_ACCOUNT_ID contains something other than digits - re-paste just the number";; esac
          # Note: the key works fine at its current length (auth succeeds every run), so only warn if it's clearly empty or tiny.
          if [ "${#HOSTAWAY_API_KEY}" -lt 40 ]; then echo "::warning::HOSTAWAY_API_KEY looks too short - re-paste just the key (no 'HOSTAWAY_API_KEY=', no spaces)"; fi

      - name: Build recommendations (reads Hostaway, never writes)
        id: build
        env:
          HOSTAWAY_ACCOUNT_ID: ${{ secrets.HOSTAWAY_ACCOUNT_ID }}
          HOSTAWAY_API_KEY: ${{ secrets.HOSTAWAY_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          COMPS_JSON: ${{ github.event.inputs.comps_json }}
          EVENTS_JSON: ${{ github.event.inputs.events_json }}
          ONLY_IF_MISSING: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: |
          python engine/recommend.py | tee /tmp/recommend.out
          if grep -q "already exists; nothing to do" /tmp/recommend.out; then
            echo "built=false" >> "$GITHUB_OUTPUT"
          else
            echo "built=true" >> "$GITHUB_OUTPUT"
            python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          r = json.load(open("recommendations/latest.json"))
          g = r.get("auto_apply") or {}
          print("auto_apply=" + ("true" if g.get("eligible") else "false"))
          print("gate_reason=" + str(g.get("reason", "")).replace("\n", " "))
          PY
          fi

      # Auto mode (decided 9/17/26): if today's run had a fresh competitor sample, apply the prices right away.
      # apply.py still enforces floor/ceiling, the per-day move cap, "not twice in a day", and config.enabled.
      - name: Apply automatically (only with a fresh competitor sample)
        id: autoapply
        if: steps.build.outputs.built == 'true' && steps.build.outputs.auto_apply == 'true'
        continue-on-error: true
        env:
          HOSTAWAY_ACCOUNT_ID: ${{ secrets.HOSTAWAY_ACCOUNT_ID }}
          HOSTAWAY_API_KEY: ${{ secrets.HOSTAWAY_API_KEY }}
          REC_DATE: latest
          APPROVAL_TEXT: "approve (automatic)"
          DRY_RUN: "0"
        run: python engine/apply.py

      - name: Note why nothing was applied
        if: steps.build.outputs.built == 'true' && steps.build.outputs.auto_apply != 'true'
        run: echo "Not applied automatically - ${{ steps.build.outputs.gate_reason }}"

      - name: Commit results
        id: commit
        run: |
          git config user.name  "cedar-pricing-bot"
          git config user.email "cedar-pricing-bot@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            RUN_DATE=$(python -c "import json;print(json.load(open('recommendations/latest.json'))['run_date'])")
            git commit -m "Recommendations for $RUN_DATE ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git pull --rebase origin main || true
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "run_date=$RUN_DATE" >> "$GITHUB_OUTPUT"
          fi

      - name: Open the day's issue (audit trail; comments starting with "approve" still work)
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_DATE: ${{ steps.commit.outputs.run_date }}
          APPLIED: ${{ steps.autoapply.outcome }}
        run: |
          TITLE="Pricing recommendations $RUN_DATE"
          # close older open approval issues so only one is live
          for n in $(gh issue list --state open --search "Pricing recommendations in:title" --json number,title --jq '.[] | select(.title != "'"$TITLE"'") | .number'); do
            gh issue close "$n" --comment "Superseded by today's recommendations."
          done
          EXISTING=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body-file recommendations/latest.md
          else
            gh issue create --title "$TITLE" --body-file recommendations/latest.md
          fi
          if [ "$APPLIED" = "success" ] || [ "$APPLIED" = "failure" ]; then
            NUM=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')
            [ -n "$NUM" ] && [ -f log/last_result.md ] && gh issue comment "$NUM" --body-file log/last_result.md
          fi

      - name: Fail the run if the automatic apply had errors
        if: steps.autoapply.outcome == 'failure'
        run: |
          echo "::error::Automatic apply reported errors or verification failures - see log/ and CHANGELOG.md"
          exit 1
